; RE6 Sideloader settings (all keys optional; delete this file to get the defaults back)
[Loader]
; 0 = load nothing, the DLL only forwards DirectInput
Enable=1
; engine = arcs skip entries that have loose files, the game loads those as loose files (real loose loading)
; patch  = arcs that contain a loose file are rebuilt with it (cached), the game always sees complete arcs
Mode=engine
; folder holding the mod folders, relative to the game folder or absolute
Root=nativePC_mod
; rebuilt arcs (patch mode only, safe to delete at any time)
CacheDir=nativePC_mod_cache
; mods to load, comma separated, later ones win; empty = every folder of Root in alphabetical order
Order=
; write re6_sideloader.log next to BH6.exe
LogFile=1
; log EVERY file the game opens (find out what the game reads); slow, debug only
LogOpens=0
